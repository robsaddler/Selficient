name: Build, Run Tests, Publish and Deploy to Production

on:
  push:
    branches: [ "main" ]

# Never let two deploys interleave; queue them instead of cancelling so every
# push still lands in order.
# The concurrency group sits on the deploy job alone (below). On the workflow it queued at most
# one pending run, and with the deploy job waiting for a runner that did not exist yet, every
# new push cancelled the previous run before its build had started (found 30 Oct 2026: M5 to M8
# never built on CI). Builds now run for every push; only deploys queue.

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    # The platform database (M19): every suite runs the real store and the real migrations against
    # a SQL Server of its own in a service container; each test host creates and drops a database.
    # The container login is composed from the run id and attempt, so no credential is written in
    # the repository and no value is reused between runs. The server exists for one job and is
    # reachable from nothing outside it.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ format('Sx{0}y{1}z!Aa9', github.run_id, github.run_attempt) }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${{ format('Sx{0}y{1}z!Aa9', github.run_id, github.run_attempt) }}' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      SELFICIENT_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=${{ format('Sx{0}y{1}z!Aa9', github.run_id, github.run_attempt) }};TrustServerCertificate=true;Encrypt=true"

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Guard against encoding corruption
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- src tests build plans product research docs ':!*node_modules*' \
            | grep -E '\.(cs|cshtml|razor|js|mjs|css|json|md|txt|yml|webmanifest)$' || true)
          if [ ${#files[@]} -eq 0 ]; then echo "No files to check"; exit 0; fi
          bad=0
          for f in "${files[@]}"; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "::error file=$f::Not valid UTF-8 — file was saved in a legacy encoding"
              bad=1
            fi
          done
          if grep -InP 'â€|Â[·»«£°¦§]|Ã[©¨ª«¢¤¶¼±§¸]' "${files[@]}"; then
            echo "::error::Mojibake (double-encoded UTF-8) found in the lines above — the file was read as Windows-1252 and re-saved. Restore the original characters."
            bad=1
          fi
          exit $bad

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore dependencies
        run: dotnet restore Selficient.slnx

      - name: Build, test, and gate coverage
        run: ./build/run-tests.ps1
        shell: pwsh
        env:
          CI: "true"

      - name: End-to-end journeys in Chromium at phone width, with axe
        run: ./build/run-e2e.ps1
        shell: pwsh
        env:
          CI: "true"

      - name: Publish Web
        run: dotnet publish src/Selficient.Web/Selficient.Web.csproj --configuration Release --output ${{ github.workspace }}/publish

      - name: Upload Publish Directory
        uses: actions/upload-artifact@v4.6.2
        with:
          name: published-app
          path: ${{ github.workspace }}/publish

      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage
          path: TestResults/*.cobertura.xml

  deploy:
    needs: build_and_test
    runs-on: [self-hosted-selficient, windows] # Make sure this matches the label for your Windows server
    # Never let two deploys interleave; queue them instead of cancelling so every push still lands in order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_POOL_NAME: "selficient.app(domain)(4.0)(pool)"
      DEPLOY_PATH: "C:\\inetpub\\vhosts\\selficient.app\\httpdocs"
      HEALTH_URL: "https://selficient.app/health/ready"
      # Self-hosted OS Open Zoomstack basemap (M5). Lives INSIDE the deploy path and is
      # excluded from robocopy /MIR below, exactly as logs and App_Data are -
      # otherwise every deploy would delete ~3 GB and the next one would re-fetch it.
      TILES_PATH: "C:\\inetpub\\vhosts\\selficient.app\\httpdocs\\tiles"
      TILES_FILE: "os-open-zoomstack.mbtiles"
      TILES_RELEASE: "2026-06"
      TILES_MIN_BYTES: "2000000000"

    steps:
      - name: Download Publish Directory
        uses: actions/download-artifact@v4.3.0
        with:
          name: published-app
          path: publish

      - name: Stop IIS Web App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          $state = (Get-WebAppPoolState -Name $env:APP_POOL_NAME).Value
          if ($state -ne "Stopped") {
            Stop-WebAppPool -Name $env:APP_POOL_NAME
          }
          # Stop-WebAppPool is asynchronous — wait until the worker process has
          # actually released its file locks before robocopy mirrors over them.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-WebAppPoolState -Name $env:APP_POOL_NAME).Value -ne "Stopped") {
            if ((Get-Date) -gt $deadline) { Write-Error "App pool did not stop within 60s"; exit 1 }
            Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 3
          Write-Host "Web app pool stopped"

      - name: Deploy Web Application
        shell: powershell
        run: |
          # /MIR deletes anything in the target that isn't in the publish output —
          # exclude runtime folders the app writes into so deploys never eat data.
          # 'tiles' is in that list for the same reason: ~3 GB of basemap the build
          # output does not contain, so /MIR would delete it on every single deploy.
          robocopy "${{ github.workspace }}\publish" $env:DEPLOY_PATH /MIR /XD logs App_Data tiles
          $robocopyExitCode = $LASTEXITCODE
          # Robocopy exit codes 0-7 are considered a success
          if ($robocopyExitCode -le 7) {
            Write-Host "Web deployment successful. Exit code: $robocopyExitCode"
            exit 0
          } else {
            Write-Error "Web deployment failed with exit code: $robocopyExitCode"
            exit $robocopyExitCode
          }

      - name: Start IIS Web App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name $env:APP_POOL_NAME).Value -ne "Started") {
            Start-WebAppPool -Name $env:APP_POOL_NAME
            Write-Host "Web app pool started"
          } else {
            Write-Host "Web app pool already started"
          }

      - name: Verify site is healthy
        shell: powershell
        run: |
          $ok = $false
          foreach ($attempt in 1..12) {
            try {
              $response = Invoke-WebRequest -Uri $env:HEALTH_URL -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) { $ok = $true; break }
              Write-Host "Attempt ${attempt}: HTTP $($response.StatusCode)"
            } catch {
              Write-Host "Attempt ${attempt}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 5
          }
          if ($ok) {
            Write-Host "Health check passed."
          } else {
            Write-Error "Site did not come healthy at $env:HEALTH_URL after deploy."
            exit 1
          }

      # The basemap is a one-off ~3 GB download from the OS Downloads API, kept beside the site
      # and outside the mirrored publish output. Deliberately last and deliberately allowed to
      # fail: the map degrades to the plain panel, and the site keeps picking the file up once it
      # lands because the store re-checks the disk every minute while it is absent.
      - name: Ensure the OS Open Zoomstack basemap is present
        continue-on-error: true
        timeout-minutes: 45
        shell: powershell
        run: |
          $target = Join-Path $env:TILES_PATH $env:TILES_FILE
          $stamp  = Join-Path $env:TILES_PATH "release.txt"
          $current = ""
          if (Test-Path $stamp) { $current = (Get-Content $stamp -Raw).Trim() }

          # Present, right release, not truncated: nothing to do. This is the normal path on
          # every deploy after the first and it costs milliseconds.
          if ((Test-Path $target) -and ($current -eq $env:TILES_RELEASE)) {
            $size = (Get-Item $target).Length
            if ($size -ge [int64]$env:TILES_MIN_BYTES) {
              Write-Host "Basemap present: $([math]::Round($size / 1GB, 2)) GB, release $current."
              exit 0
            }
            Write-Warning "Basemap is only $([math]::Round($size / 1GB, 2)) GB - treating as truncated and re-fetching."
          }

          # The OS Downloads API is open for OpenData products: no account, no key, no secret.
          # The index call also hands back the published MD5, which is the integrity check.
          $index = "https://api.os.uk/downloads/v1/products/OpenZoomstack/downloads?area=GB"
          try {
            $downloads = Invoke-RestMethod -Uri $index -UseBasicParsing -TimeoutSec 120
            $mbtiles = $downloads | Where-Object { $_.format -eq "Vector Tiles" -and $_.subformat -eq "(MBTiles)" } | Select-Object -First 1
          } catch {
            Write-Warning "Could not reach the OS Downloads API: $($_.Exception.Message). The map will use its fallback."
            exit 0
          }

          if (-not $mbtiles) {
            Write-Warning "The OS Downloads API returned no MBTiles build. The map will use its fallback."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path $env:TILES_PATH | Out-Null
          $temp = "$target.partial"
          Write-Host "Fetching OS Open Zoomstack - a one-off download of $([math]::Round($mbtiles.size / 1GB, 2)) GB."
          try {
            # Written to .partial and only moved into place once it verifies, so an interrupted
            # run can never leave a half-file that looks installed.
            Invoke-WebRequest -Uri $mbtiles.url -OutFile $temp -UseBasicParsing -TimeoutSec 3600
          } catch {
            Remove-Item $temp -Force -ErrorAction SilentlyContinue
            Write-Warning "Basemap download failed: $($_.Exception.Message). The map will use its fallback."
            exit 0
          }

          $size = (Get-Item $temp).Length
          if ($size -lt [int64]$env:TILES_MIN_BYTES) {
            Remove-Item $temp -Force
            Write-Warning "Downloaded basemap was only $([math]::Round($size / 1GB, 2)) GB - discarded as incomplete."
            exit 0
          }

          $hash = (Get-FileHash -Algorithm MD5 $temp).Hash.ToLower()
          if ($hash -ne $mbtiles.md5.ToLower()) {
            Remove-Item $temp -Force
            Write-Warning "Basemap MD5 was $hash, expected $($mbtiles.md5) - discarded. The map will use its fallback."
            exit 0
          }

          Move-Item $temp $target -Force
          Set-Content -Path $stamp -Value $env:TILES_RELEASE -Encoding utf8
          Write-Host "Basemap installed: $([math]::Round($size / 1GB, 2)) GB, release $env:TILES_RELEASE, MD5 verified."
