<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    The marks: one per need and one per source, 24 by 24, drawn with 2 px strokes in the current
    colour. Lantern appears once per mark at most, as the light source, and falls back to the
    design direction's hex where the token is not in scope.
  -->
  <!-- Needs -->
  <symbol id="need-drinkingwater" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 3h6M10 3v3.5L7.5 9v10a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2V9L14 6.5V3"/>
    <path d="M8 14h8"/>
  </symbol>
  <symbol id="need-food" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="6" width="14" height="14" rx="2"/>
    <path d="M5 10h14M9 6V4h6v2"/>
  </symbol>
  <symbol id="need-warmth" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
