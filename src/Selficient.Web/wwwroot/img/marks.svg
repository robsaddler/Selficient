    <path d="M4 4h4a4 4 0 0 1 4 4v1"/>
    <path d="M8 10h8l-1 3H9z"/>
    <path d="M10 16v3M13 16v4M16 16v3M7 16v2"/>
  </symbol>
  <symbol id="need-internet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
