  <symbol id="source-rooftop-solar-and-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 11l10-7 10 7"/>
    <path d="M6 9.5l3-2 4 2.8-3 2zM12 10.3l3-2 4 2.8-3 2z"/>
    <rect x="9" y="15" width="6" height="6" rx="1"/>
    <path d="M11 14v1M13 14v1"/>
