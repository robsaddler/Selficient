  </symbol>
  <symbol id="need-dependants" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="7" r="3"/>
    <path d="M4 20v-3a5 5 0 0 1 10 0v3M16 9l1.5 2 1.5-2M15 11h5l-1 6h-3z"/>
  </symbol>
  <symbol id="need-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
