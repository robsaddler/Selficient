  <symbol id="scenario-storm" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 24h18a7 7 0 0 0 0-14 9 9 0 0 0-17 3 5.5 5.5 0 0 0-1 11z"/>
    <path fill="var(--c-lantern, #E8A33D)" stroke="none" d="M21 23l-6 9h6l-3 7 10-11h-6l3-5z"/>
  </symbol>
  <symbol id="scenario-blackout" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 4l-8 32M20 4l8 32M14 28h12M15.5 20h9M10 12h20M13 12l7 8 7-8"/>
    <circle fill="var(--c-lantern, #E8A33D)" stroke="none" cx="33" cy="30" r="3.5"/>
    <path d="M4 36l32-32"/>
  </symbol>
  <symbol id="scenario-water" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
