    <circle fill="var(--c-lantern, #E8A33D)" stroke="none" cx="22" cy="28" r="1.5"/>
  </symbol>

  <!-- Use my location: a pin with the lantern at its heart -->
  <symbol id="mark-device" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="3" width="10" height="18" rx="2"/>
    <circle fill="var(--c-lantern, #E8A33D)" stroke="none" cx="12" cy="17" r="1.4"/>
  </symbol>
  <symbol id="mark-locate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
