  <symbol id="source-planned" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
    <path d="M13 13h3M13 17h3M8.5 13h.5M8.5 17h.5"/>
    <path stroke="var(--c-lantern, #E8A33D)" d="M8 8l1.5 1.5L12.5 6.5"/>
    <path d="M15 8h1"/>
  </symbol>
  <symbol id="source-power-banks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
