    <circle fill="var(--c-lantern, #E8A33D)" stroke="none" cx="20" cy="20" r="3.5"/>
  </symbol>
  <symbol id="scenario-regional" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="9" width="28" height="24" rx="3"/>
    <path d="M6 16h28M13 6v6M27 6v6"/>
    <path fill="currentColor" stroke="none" d="M10 20h4v3h-4zM18 20h4v3h-4zM26 20h4v3h-4zM10 26h4v3h-4z"/>
